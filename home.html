<!doctype html>
<html data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- tailwind  + daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <!-- CSS -->
    <link rel="stylesheet" href="./style/home.css">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">
    <title>Payoo | Home</title>

</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto ">
    <header class="border-b-2 border-gray-300 sticky top-0 bg-base-200 z-10">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center  ">
            <div class="left flex gap-2">
                <div class="logo w-[60px]">
                    <img src="./assets/logo.png" alt="">

                </div>
                <div class="balance-info">
                    <h2 class="text-2xl font-bold">$ <span id="balance">45000</span></h2>
                    <p class="text-neutral/50">Available Balance</p>
                </div>
            </div>
            <div class="right">
                <a href="index.html" class="btn btn-soft"><i class="fa-solid fa-arrow-right-from-bracket"></i> Log
                    Out</a>
            </div>

        </section>
    </header>

    <main class="w-11/12 ma-auto mt-8 ml-8 ">
        <section>
            <h1 class="text-2xl font-bold">Welcome to pay<span class="text-primary">oo</span></h1>
            <p class="text-neutral/50 mt-3">Enjoy easy and convenient financial services with us. Cashout charge is low
                and </p>

            <div class="buttons grid grid-cols-3 gap-3 mt-6 mr-8">
                <button onclick="showOnly('add-money')" class="btn flex-col h-full py-4 btn-soft">
                    <img src="./assets/opt-1.png" alt="">
                    <p>Add Money</p>
                </button>
                <button onclick="showOnly('cashout')" class="btn flex-col h-full py-4 btn-soft">
                    <img src="./assets/opt-2.png" alt="">
                    <p>Cash Out</p>
                </button>
                <button class="btn flex-col h-full py-4 btn-soft">
                    <img src="./assets/opt-3.png" alt="">
                    <p>Transfer Money</p>
                </button>
                <button class="btn flex-col h-full py-4 btn-soft">
                    <img src="./assets/opt-3.png" alt="">
                    <p>Get Bonus</p>
                </button>
                <button class="btn flex-col h-full py-4 btn-soft">
                    <img src="./assets/opt-5.png" alt="">
                    <p>Pay Bill</p>
                </button>
                <button class="btn flex-col h-full py-4 btn-soft">
                    <img src="./assets/opt-6.png" alt="">
                    <p>Transaction</p>
                </button>

            </div>
        </section>

        <!-- Add Money -->
        <section id="add-money" class="mt-5 w-11/12 mx-auto py-5 hidden">
            <h2 class="text-xl font-bold">Add Money</h2>
            <div class="card bg-base-100 w-full  shadow rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-[#080808] text-xl font-semibold  ">Select A bank</label>
                        <select id="add-money-bank" class="select rounded-3xl w-full bg-base-200 ">
                            <option disabled selected>Select A Bank </option>
                            <option value="DuchBangla">Duch Bangla</option>
                            <option value="IslamiBank">Islami Bank</option>
                            <option value="CityBank">City Bank</option>
                        </select>
                        <label class="label text-[#080808] text-xl font-semibold  ">Bank Account Number</label>
                        <input id="add-money-number" maxlength="11" minlength="11" type="text"
                            class="input rounded-3xl bg-base-200 w-full"
                            placeholder="Enter your Bank Account 11 digit Number" />
                        <label class="label text-[#080808] text-xl font-semibold  ">Amount to Add</label>
                        <input id="add-money-amount" type="number" class="input rounded-3xl bg-base-200 w-full"
                            placeholder="Enter Amount to add " />
                        <label class="label text-[#080808] text-xl font-semibold  ">4 Digit Pin</label>
                        <input id="add-money-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-3xl bg-base-200 w-full " placeholder="Enter 4 Digit Pin" />

                        <button id="add-money-btn" class="btn btn-neutral mt-4 bg-[#3B25C1] rounded-3xl border-none">Add
                            Money</button>
                    </fieldset>
                </div>
            </div>


        </section>

        <!-- Cashout -->
        <section id="cashout" class="mt-5 w-11/12 mx-auto py-5 hidden">
            <h2 class="text-xl font-bold">Cashout</h2>
            <div class="card bg-base-100 w-full  shadow rounded-2xl">
                <div class="card-body">
                    <fieldset class="fieldset">
                        <label class="label text-[#080808] text-xl font-semibold  ">Agent Number</label>
                        <input id="cashout-number" maxlength="11" minlength="11" type="text"
                            class="input rounded-3xl bg-base-200 w-full"
                            placeholder="Enter your Agent 11 digit Number" />
                        <label class="label text-[#080808] text-xl font-semibold  ">Amount</label>
                        <input id="cashout-amount" type="number" class="input rounded-3xl bg-base-200 w-full"
                            placeholder="Enter Amount for withdraw" />
                        <label class="label text-[#080808] text-xl font-semibold  ">4 Digit Pin</label>
                        <input id="cashout-pin" maxlength="4" minlength="4" type="password"
                            class="input rounded-3xl bg-base-200 w-full " placeholder="Enter 4 Digit Pin" />

                        <button id="cashout-btn"
                            class="btn btn-neutral mt-4 bg-[#3B25C1] rounded-3xl border-none">Withdraw Money</button>
                    </fieldset>
                </div>
            </div>
        </section>

    </main>


    <!-- <script src="./script/home.js"></script> -->
    <script src="./script/machine.js"></script>
    <script src="./script/addMoney.js"></script>
    <script src="./script/cashout.js"></script>
</body>

</html>
